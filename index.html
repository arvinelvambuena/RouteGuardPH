<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RouteGuard PH V3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}header{background:#111827;color:#fff;padding:14px;font-weight:bold}
#status{font-size:12px;font-weight:normal;margin-top:3px}#map{height:62vh;min-height:420px}.controls,.panel{background:#fff;padding:12px}
button,input,textarea{font:inherit}button{padding:11px;border:1px solid #ccd3da;border-radius:9px;background:#fff}
#mainBtn{width:100%;padding:16px;border:0;border-radius:12px;background:#d62828;color:#fff;font-weight:bold;font-size:17px}
#mainBtn.drawing{background:#166534}.row{display:flex;gap:8px;margin-top:9px}.row button{flex:1}
input,textarea{width:100%;padding:10px;border:1px solid #ccd3da;border-radius:9px;margin-top:8px}
.report{padding:10px;border:1px solid #ddd;border-radius:9px;margin:8px 0}.small{font-size:12px;color:#667085}
#hint{padding:8px 12px;background:#fff7ed;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:3000;align-items:flex-end}
.card{background:#fff;width:100%;padding:18px;border-radius:18px 18px 0 0}.choice{display:block;width:100%;margin:7px 0;text-align:left}.hidden{display:none}
</style></head>
<body>
<header>ROUTEGUARD PH V3<div id="status">Starting…</div></header>
<div id="hint">Use only when safely stopped. Tap the map to mark points along the problem road.</div>
<div id="map"></div>
<div class="controls">
<button id="mainBtn">🚧 REPORT ROAD PROBLEM</button>
<div class="row"><button onclick="locateMe()">📍 My Location</button><button onclick="undoPoint()">↩ Undo</button><button onclick="cancelDrawing()">✖ Cancel</button></div>
</div>
<div class="panel"><h3>MY MARKED ROUTES</h3><input id="search" placeholder="Search road/problem…" oninput="renderReports()">
<div class="row"><button onclick="exportData()">💾 Backup</button><button onclick="clearAll()">🗑 Clear All</button></div><div id="reports"></div></div>

<div id="modal" class="modal"><div class="card"><h2 id="modalTitle">Choose problem</h2>
<div id="choices">
<button class="choice" onclick="chooseReason('Heavy traffic')">🚗 Heavy traffic</button>
<button class="choice" onclick="chooseReason('Flood-prone')">🌊 Flood-prone</button>
<button class="choice" onclick="chooseReason('Rough road / potholes')">🕳 Rough road / potholes</button>
<button class="choice" onclick="chooseReason('Construction / closure')">🚧 Construction / closure</button>
<button class="choice" onclick="chooseReason('Narrow / difficult')">⚠️ Narrow / difficult</button>
<button class="choice" onclick="chooseReason('Other')">📌 Other</button></div>
<div id="saveArea" class="hidden"><p id="selectedReason"></p><textarea id="note" rows="3" placeholder="Optional note…"></textarea>
<div class="row"><button onclick="saveReport()">✅ Save Report</button><button onclick="closeModal()">Cancel</button></div></div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="routeguard_ph_v3";let reports=JSON.parse(localStorage.getItem(KEY)||"[]");
const map=L.map("map").setView([14.5995,120.9842],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
let drawing=false,points=[],line=null,selectedReason="",locationMarker=null,accuracyCircle=null;
const status=t=>document.getElementById("status").textContent=t;
function openModal(){document.getElementById("modal").style.display="flex"}function closeModal(){document.getElementById("modal").style.display="none"}
function chooseReason(r){selectedReason=r;document.getElementById("selectedReason").innerHTML="<b>Problem:</b> "+r;document.getElementById("choices").classList.add("hidden");document.getElementById("saveArea").classList.remove("hidden");closeModal();drawing=true;points=[];if(line)map.removeLayer(line);line=null;document.getElementById("mainBtn").textContent="✅ FINISH & SAVE ROAD REPORT";document.getElementById("mainBtn").classList.add("drawing");status("Tap at least 2 points along the affected road.")}
document.getElementById("mainBtn").onclick=()=>{if(!drawing){document.getElementById("choices").classList.remove("hidden");document.getElementById("saveArea").classList.add("hidden");openModal()}else{if(points.length<2){alert("Please tap at least 2 points along the road.");return}document.getElementById("modalTitle").textContent="Save road report";document.getElementById("choices").classList.add("hidden");document.getElementById("saveArea").classList.remove("hidden");openModal()}};
map.on("click",e=>{if(!drawing)return;points.push([e.latlng.lat,e.latlng.lng]);if(line)map.removeLayer(line);line=L.polyline(points,{weight:7}).addTo(map);status("Points: "+points.length+" — add more or press Finish & Save.")});
function undoPoint(){if(!drawing||!points.length)return;points.pop();if(line)map.removeLayer(line);line=points.length?L.polyline(points,{weight:7}).addTo(map):null;status("Points: "+points.length)}
function cancelDrawing(){drawing=false;points=[];selectedReason="";if(line)map.removeLayer(line);line=null;closeModal();document.getElementById("mainBtn").textContent="🚧 REPORT ROAD PROBLEM";document.getElementById("mainBtn").classList.remove("drawing");status("Ready")}
function saveReport(){if(points.length<2)return alert("At least 2 points are required.");reports.push({id:Date.now(),reason:selectedReason,note:document.getElementById("note").value.trim(),points,time:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(reports));cancelDrawing();renderReports();drawReports();alert("Road report saved on this phone.")}
function drawReports(){document.querySelectorAll(".saved-line").forEach(x=>map.removeLayer(x));reports.forEach(r=>{let l=L.polyline(r.points,{weight:6,opacity:.75,className:"saved-line"}).addTo(map);l.bindPopup("<b>"+esc(r.reason)+"</b><br>"+esc(r.note||"No note")+"<br><span class='small'>"+new Date(r.time).toLocaleString()+"</span>")})}
function renderReports(){let q=document.getElementById("search").value.toLowerCase(),box=document.getElementById("reports");box.innerHTML="";reports.filter(r=>(r.reason+" "+r.note).toLowerCase().includes(q)).slice().reverse().forEach(r=>{let d=document.createElement("div");d.className="report";d.innerHTML="<b>"+esc(r.reason)+"</b><span class='small'>"+new Date(r.time).toLocaleString()+"</span><br>"+esc(r.note||"No note");let row=document.createElement("div");row.className="row";let j=document.createElement("button");j.textContent="📍 Show on Map";j.onclick=()=>map.fitBounds(L.latLngBounds(r.points),{padding:[30,30]});let x=document.createElement("button");x.textContent="Delete";x.onclick=()=>{if(confirm("Delete this report?")){reports=reports.filter(a=>a.id!==r.id);localStorage.setItem(KEY,JSON.stringify(reports));renderReports();drawReports()}};row.append(j,x);d.appendChild(row);box.appendChild(d)});if(!reports.length)box.innerHTML="<div class='small'>No reports yet.</div>"}
function clearAll(){if(reports.length&&confirm("Delete all saved reports on this phone?")){reports=[];localStorage.setItem(KEY,"[]");renderReports();drawReports()}}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(reports,null,2)],{type:"application/json"}));a.download="routeguard-ph-backup.json";a.click()}
function locateMe(){if(!navigator.geolocation)return alert("GPS is not available.");status("Getting GPS location…");navigator.geolocation.getCurrentPosition(p=>{let x=[p.coords.latitude,p.coords.longitude];if(locationMarker)map.removeLayer(locationMarker);if(accuracyCircle)map.removeLayer(accuracyCircle);locationMarker=L.marker(x).addTo(map).bindPopup("You are here").openPopup();accuracyCircle=L.circle(x,{radius:p.coords.accuracy}).addTo(map);map.setView(x,17);status("GPS ready — accuracy about "+Math.round(p.coords.accuracy)+" m")},e=>{status("GPS unavailable");alert("GPS could not be accessed. Try Chrome/Firefox over HTTPS.")},{enableHighAccuracy:true,timeout:10000,maximumAge:5000})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
drawReports();renderReports();status("Map ready");
</script></body></html>
